[project]
name = "op_importer"
requires-python = ">= 3.13"
license= "MIT"
scripts = { op_import = "op_importer.app:app" }
version = "0.1.0"
dependencies = ["python-dotenv>=1.2.1,<2", "requests>=2.32.5,<3", "pydantic>=2.10.4,<3", "rich>=14.2.0,<15", "textual>=8,<9"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
authors = ["Will Usher <will.usher@openenergytransition.org>"]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.package]
name = "op_importer"
version = "0.1.0"

[tool.pixi.pypi-dependencies]
op_importer = { path = ".", editable = true }

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "0.4.*"}

[tool.pixi.tasks]
start = "op_import"

[tool.pixi.dependencies]
requests = ">=2.32.5,<3"
pytest = ">=9.0.2,<10"
pydantic = ">=2.10.4,<3"
rich = ">=14.2.0,<15"
textual = ">=8,<9"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pytest.ini_options]
markers = ["live: needs the OpenProject server configured in .env"]
addopts = "-m 'not live'"

[dependency-groups]
test = ["pytest"]
